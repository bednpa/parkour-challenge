<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parkour challenge - aneb na skok do dětství</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05070f;color:#e9f2ff;font-family:'Courier New',ui-monospace,monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#14243f,#05070f 70%)}
#c{height:100%;max-width:100%;aspect-ratio:320/480;image-rendering:pixelated;display:block;box-shadow:0 0 0 2px #1d2b4d,0 8px 40px #000}
#mute{position:absolute;left:8px;bottom:8px;z-index:6;padding:7px 10px;font-size:15px;border-radius:12px;background:rgba(29,43,77,.85);color:#cfe0ff;box-shadow:none;opacity:.85}
#ctrl{flex:0 0 auto;display:grid;grid-template-columns:1fr;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0a0f1e;border-top:2px solid #1d2b4d;min-height:108px;align-content:center}
#ctrl.multi{grid-template-columns:1fr 1fr}
#ctrl:empty::after{content:'běžíš...';grid-column:1/-1;text-align:center;font-size:12px;color:#5f7099;letter-spacing:1px}
button{font:700 15px/1.15 'Courier New',monospace;letter-spacing:1px;text-transform:uppercase;color:#08101f;background:#ffd166;border:0;border-radius:14px;padding:18px 8px;box-shadow:0 5px 0 #b8892f;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b8892f}
button.danger{background:#ff5d73;color:#fff;box-shadow:0 5px 0 #a3273a}
button.ok{background:#3ddc97;box-shadow:0 5px 0 #1f8c5e}
button.cool{background:#68d8ff;box-shadow:0 5px 0 #2a7f9e}
button.warn{background:#c9a0ff;box-shadow:0 5px 0 #6d47a8}
button.ghost{background:#2b3757;color:#cfe0ff;box-shadow:0 5px 0 #161f36}
button.small{font-size:12px;padding:12px 6px}
button.span2{grid-column:1/-1}
button[disabled]{opacity:.45}
#ov{position:absolute;inset:0;display:none;place-items:center;padding:14px;background:rgba(4,7,16,.93);text-align:center;overflow-y:auto;z-index:5}
#ov.on{display:grid}
#ovBox{max-width:304px;width:100%}
#ovArt svg{width:100px;height:auto;margin:0 auto 8px;display:block}
#ov h1{font-size:18px;color:#ffd166;letter-spacing:1px;margin-bottom:8px;text-shadow:2px 2px 0 #000;line-height:1.3}
#ov p{font-size:12.5px;line-height:1.55;color:#c8d8f5;margin-bottom:12px}
#ov p b{color:#fff}
#ovBtns{display:grid;gap:8px;grid-template-columns:1fr}
#ovBtns.two{grid-template-columns:1fr 1fr}
table.tb{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:12px}
table.tb th{color:#7f92b8;font-size:9px;letter-spacing:1px;padding:3px 5px;border-bottom:1px solid #263455;text-align:left}
table.tb th.r,table.tb td.r{text-align:right}
table.tb td{padding:5px;border-bottom:1px solid #16203a;color:#dce9ff;text-align:left}
table.tb td.t{text-align:right;color:#ffd166;font-weight:700}
table.tb tr.hl td{background:#17331f;color:#8ef0c8}
.note{font-size:10px;color:#6c7fa6;margin:-2px 0 10px;letter-spacing:.5px}
.note b{color:#8ef0c8}
input.nm{width:100%;padding:12px;margin:2px 0 10px;border:2px solid #2b3757;border-radius:12px;background:#0d1426;color:#fff;font:700 15px 'Courier New',monospace;text-align:center;text-transform:uppercase}
</style>
</head>

<canvas id="c" width="320" height="480"></canvas>

<div id="ov" class="on"><div id="ovBox"><div id="ovArt"></div><h1 id="ovT"></h1><p id="ovB"></p><div id="ovBtns"></div></div></div>
</div>
<div id="ctrl"></div>
</div>

 var g=A.createGain();g.gain.value=v||0.25;
 s.connect(bq);bq.connect(g);g.connect(MG);s.start(t0);}catch(e){}}

function setMute(m){MUTED=m;LS(MKEY,m?'1':'0');if(D.mute)D.mute.innerHTML=m?'&#128263;':'&#128266;';}
var LB={mode:'local',list:[],loaded:false,busy:false,err:''};
function lbMode(){var u=CFG.supabaseUrl||'';
 if(CFG.board==='supabase'&&u.indexOf('supabase.co')>0&&u.indexOf('TVUJ')<0&&(CFG.supabaseKey||'').length>20)return 'supabase';
 if(CFG.board==='jsonblob'&&(CFG.jsonblobId||'').length>3)return 'jsonblob';
 return 'local';}
function locGet(){var v=LS(LKEY),a=[];try{a=v?JSON.parse(v):[];}catch(e){a=[];}return a&&a.length?a:[];}
function locSet(a){LS(LKEY,JSON.stringify(a.slice(0,50)));}
function sortRows(a){a.sort(function(x,y){return x.ms-y.ms;});return a;}
function normRows(raw){var i,o,r=[];if(!raw||!raw.length)return r;
 for(i=0;i<raw.length;i++){o=raw[i];if(!o)continue;
  r.push({n:String(o.name!==undefined?o.name:(o.n||'?')).slice(0,12),
          ms:Math.round(Number(o.time_ms!==undefined?o.time_ms:o.ms)||0),
          p:Number(o.perfects!==undefined?o.perfects:(o.p||0))||0});}
 return sortRows(r.filter(function(x){return x.ms>=30000&&x.ms<=900000;}));}
function jfetch(url,opt,cb){var done=false,to;
 function fin(e,d){if(done)return;done=true;if(to)clearTimeout(to);cb(e,d);}
 if(typeof fetch!=='function'){fin('nofetch');return;}
 to=setTimeout(function(){fin('timeout');},9000);
 try{fetch(url,opt).then(function(r){
  if(!r||!r.ok){fin('http'+(r?r.status:'?'));return;}
  if(opt&&opt.noBody){fin(null,null);return;}
  r.json().then(function(j){fin(null,j);},function(){fin('parse');});
 },function(){fin('net');});}catch(e){fin('ex');}}
function lbLoad(cb){var m=lbMode(),url,hd;LB.mode=m;LB.err='';
 if(m==='local'){LB.list=sortRows(locGet());LB.loaded=true;if(cb)cb();return;}
 LB.busy=true;
 if(m==='supabase'){url=CFG.supabaseUrl+'/rest/v1/'+CFG.table+'?select=name,time_ms,perfects&order=time_ms.asc&limit=25';
  hd={apikey:CFG.supabaseKey,Authorization:'Bearer '+CFG.supabaseKey};}
 else{url='https://jsonblob.com/api/jsonBlob/'+CFG.jsonblobId;hd={};}
 jfetch(url,{method:'GET',headers:hd},function(e,j){LB.busy=false;LB.loaded=true;
  if(e){LB.err=e;LB.list=sortRows(locGet());if(cb)cb();return;}
  LB.list=normRows(j&&j.length?j:(j&&j.rows?j.rows:[]));
  locSet(LB.list);if(cb)cb();});}
function lbSubmit(name,ms,perf,lives,cb){var m=lbMode(),rec,url,hd,mine,all;
 rec={n:name,ms:ms,p:perf};
 all=locGet();all.push(rec);locSet(sortRows(all));
 if(m==='local'){LB.mode='local';LB.list=sortRows(locGet());cb(null);return;}
 LB.busy=true;
 if(m==='supabase'){url=CFG.supabaseUrl+'/rest/v1/'+CFG.table;
  hd={apikey:CFG.supabaseKey,Authorization:'Bearer '+CFG.supabaseKey,'Content-Type':'application/json',Prefer:'return=minimal'};
  jfetch(url,{method:'POST',headers:hd,noBody:true,body:JSON.stringify({name:name,time_ms:ms,perfects:perf,lives:lives})},function(e){
   LB.busy=false;if(e){LB.err=e;LB.list=sortRows(locGet());cb(e);return;}lbLoad(function(){cb(null);});});
  return;}
 mine=sortRows(normRows(LB.list).concat([rec]));
 jfetch('https://jsonblob.com/api/jsonBlob/'+CFG.jsonblobId,{method:'PUT',headers:{'Content-Type':'application/json'},noBody:true,
  body:JSON.stringify(mine.slice(0,50).map(function(r){return {name:r.n,time_ms:r.ms,perfects:r.p};}))},function(e){
  LB.busy=false;if(e){LB.err=e;cb(e);return;}lbLoad(function(){cb(null);});});}
function lbTable(hlName,hlMs,max){var L=LB.list||[],i,r,n=Math.min(L.length,max||10),md=['&#129351;','&#129352;','&#129353;'],hit=false,cls;
 if(!L.length)return '<p class="note">'+(LB.busy?'načítám tabulku...':'Zatím tu není žádný čas. Buď první!')+'</p>';
 r='<table class="tb"><tr><th>#</th><th>hráč</th><th class="r">čas</th><th class="r">P</th></tr>';
 for(i=0;i<n;i++){cls='';
  if(!hit&&hlName&&L[i].n===hlName&&Math.abs(L[i].ms-hlMs)<20){cls=' class="hl"';hit=true;}
  r+='<tr'+cls+'><td>'+(i<3?md[i]:(i+1)+'.')+'</td><td>'+esc(L[i].n)+'</td><td class="t">'+fmt(L[i].ms/1000)+'</td><td class="r">'+L[i].p+'</td></tr>';}
 r+='</table>';

  (LB.err?' &middot; offline: '+esc(LB.err):'')+'</p>';
 return r;}
var FACES={tom:null,vojta:null};
function faceCanvas(img,cx,cy,size){var SZ=128,c,g,i,k,a,bd,sm,sg,bl,bg,st,stg,b2,b2g,A,B,o,od,den,sh,lum,r,gg,bb,rg;
 c=document.createElement('canvas');c.width=SZ;c.height=SZ;g=c.getContext('2d');
 g.imageSmoothingEnabled=true;if('imageSmoothingQuality' in g)g.imageSmoothingQuality='high';
 g.drawImage(img,cx-size/2,cy-size/2,size,size,0,0,SZ,SZ);
 try{
  sm=document.createElement('canvas');sm.width=64;sm.height=64;sg=sm.getContext('2d');sg.imageSmoothingEnabled=true;sg.drawImage(c,0,0,64,64);
  bl=document.createElement('canvas');bl.width=SZ;bl.height=SZ;bg=bl.getContext('2d');bg.imageSmoothingEnabled=true;bg.drawImage(sm,0,0,SZ,SZ);
  st=document.createElement('canvas');st.width=18;st.height=18;stg=st.getContext('2d');stg.imageSmoothingEnabled=true;stg.drawImage(c,0,0,18,18);
  b2=document.createElement('canvas');b2.width=SZ;b2.height=SZ;b2g=b2.getContext('2d');b2g.imageSmoothingEnabled=true;b2g.drawImage(st,0,0,SZ,SZ);
  A=g.getImageData(0,0,SZ,SZ);B=bg.getImageData(0,0,SZ,SZ);o=b2g.getImageData(0,0,SZ,SZ);
  a=A.data;bd=B.data;od=o.data;
  for(i=0;i<a.length;i+=4){for(k=0;k<3;k++){den=a[i+k]*0.32+bd[i+k]*0.68;sh=den+(den-od[i+k])*0.42;a[i+k]=clamp(sh,0,255);}}
  for(i=0;i<a.length;i+=4){r=a[i];gg=a[i+1];bb=a[i+2];lum=0.299*r+0.587*gg+0.114*bb;
   a[i]=clamp((lum+(r-lum)*1.22-128)*1.12+130,0,255);
   a[i+1]=clamp((lum+(gg-lum)*1.22-128)*1.12+130,0,255);
   a[i+2]=clamp((lum+(bb-lum)*1.22-128)*1.12+130,0,255);}
  g.putImageData(A,0,0);
 }catch(e){}
 g.globalCompositeOperation='destination-in';
 rg=g.createRadialGradient(SZ/2,SZ*0.48,SZ*0.3,SZ/2,SZ*0.48,SZ*0.5);
 rg.addColorStop(0,'rgba(0,0,0,1)');rg.addColorStop(0.82,'rgba(0,0,0,1)');rg.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=rg;g.fillRect(0,0,SZ,SZ);g.globalCompositeOperation='source-over';
 return c;}
function loadFaces(){var ks=['tom','vojta'],i;
 for(i=0;i<ks.length;i++)(function(k){var ex=['.png','.jpg','.jpeg','.PNG','.JPG'],n=0,cf=CFG.faces[k]||{x:0.5,y:0.4,s:0.5};

var STAGES=[
 {t:'goal',x:520,w:54,dur:1.3,n:1},
 {t:'bins',x:950,w:16,h:30,n:2},

 {t:'bins',x:1810,w:26,h:38,n:4},

 {t:'bins',x:2670,w:34,h:42,n:6},

 {t:'goal',x:3960,w:96,dur:1.3,n:9},
 {t:'bins',x:4390,w:41,h:60,n:10},
 {t:'goal',x:4820,w:102,dur:1.3,n:11},

function jumpT(h){var disc=JUMPV*JUMPV-2*GRAV*h;if(disc<=0)return null;var r=Math.sqrt(disc);return {a:(JUMPV-r)/GRAV,b:(JUMPV+r)/GRAV};}
function winOf(o){var lo,hi,t,SAFE=2.2;
 if(o.t==='goal'){hi=o.x-HALF;lo=o.x+o.w+HALF-o.dur*SPEED;}
 else if(o.t==='bins'){t=jumpT(o.h);if(!t)return null;hi=o.x-HALF-t.a*SPEED;lo=o.x+o.w+HALF-t.b*SPEED;}
 else return null;
 lo+=SAFE;hi-=SAFE;
 return {lo:lo,hi:hi,c:(lo+hi)/2,half:(hi-lo)/2};}
function newGame(){var cl=[],i,ob=[],o,k;
 for(i=0;i<6;i++)cl.push({x:i*70+10,y:18+mod(i*53,60),s:0.7+mod(i*37,30)/60});
 for(i=0;i<STAGES.length;i++){o={};for(k in STAGES[i])o[k]=STAGES[i][k];o.pressed=false;o.bad='';o.rate='';ob.push(o);}
 G={state:'menu',time:0,lives:LIVES0,xp:0,idx:0,shake:0,flash:0,act:'',drank:false,stepT:0,
  perf:0,good:0,combo:0,best:0,fx:[],tram:0,
  P:{x:60,y:0,vy:0,duck:0,air:false,anim:0},

function curO(){return G.obst[G.idx]||null;}
function pushFx(x,y,t,c){G.fx.push({x:x,y:y,t:t,c:c,life:0.8});}
function rate(o,px){var w=winOf(o),dev;
 if(!w)return 'miss';
 if(px<w.lo){o.bad='early';return 'early';}
 if(px>w.hi){o.bad='late';return 'late';}
 dev=Math.abs(px-w.c)/Math.max(1,w.half);
 return dev<=0.45?'perfect':'good';}
function judge(o,px){var r=rate(o,px);o.pressed=true;o.rate=r;
 if(r==='perfect'){G.perf++;G.combo++;if(G.combo>G.best)G.best=G.combo;
  if(G.combo>=3){S.combo(Math.min(G.combo,8));pushFx(G.P.x,-64,G.combo+'x PERFEKT!','#8ef0c8');}

  b(x+1,GY-38,8,8,'#c99a72');b(x,GY-40,10,3,ph===0?'#2b1a0c':(ph===1?'#7a5a2a':'#4a3018'));}
 stopSign(sx+128,'STARÁ OSADA');}
function drawSign(sx,s,sub){b(sx,GY-44,3,44,'#6b4a25');b(sx-32,GY-66,68,22,'#e8c37a');b(sx-32,GY-66,68,3,'#c49a4d');

function drawHud(){var o,n;
 b(0,0,W,46,'rgba(6,10,24,.72)');b(0,46,W,2,'#1d2b4d');

 bar(6,18,104,9,G.lives/100,'#ff4d6d','#ff97ab');

 bar(W-110,18,104,9,G.xp/100,'#18c48c','#7ff7d0');

 txt('PERFEKT '+G.perf+'/'+NOBST+(G.combo>=2?'   COMBO '+G.combo+'x':''),W/2,29,G.combo>=3?'#7ff7d0':'#8ef0c8','bold 7px monospace','center');
 txt('PŘEKÁŽKA '+Math.min(G.idx+1,NOBST)+'/'+NOBST,W/2,40,'#9fb6e0','bold 7px monospace','center');
 if(G.state==='run'){o=curO();if(o){
  n={goal:'FOTBALOVÁ BRÁNA',bins:'POPELNICE',juice:'OPRCHAL JUICE',fight:'BITKA – STARÁ OSADA'}[o.t];

 b(W/2-74,64,148,32,'rgba(6,10,24,.84)');b(W/2-74,64,148,2,'#ff4d6d');
 txt('VOJTĚCH POSPÍŠIL',W/2,78,'#ff8fa3','bold 9px monospace','center');
 bar(W/2-64,82,128,8,F.hp/100,'#ff4d6d','#ff97ab');
 if(F.intro>0){a=F.intro>0.25?1:F.intro/0.25;ctx.globalAlpha=a;

  txt('TOM   vs   VOJTA',W/2,GY/2-18,'#ffd166','bold 15px monospace','center');
  txt('„V ÚVOZOVKÁCH BITKA“',W/2,GY/2+0,'#cfe0ff','bold 9px monospace','center');

  ctx.globalAlpha=1;}
 if(F.phase==='wind')txt(F.atk==='kick'?'KOP! (uhni)':'RÁNA! (blok)',W/2,GY+40,F.atk==='kick'?'#c9a0ff':'#68d8ff','bold 9px monospace','center');
 else if(F.msgT>0)txt(F.msg,W/2,GY+40,'#ffd166','bold 9px monospace','center');}
function draw(){var P=G.P,camX,i,o,sx,F,px,bx,d,fz,sp,st,bs;
 if(!ctx)return;
 F=G.F;fz=(G.state==='fight'&&F)?1:0;
 camX=fz?F.camX:P.x-84;
 ctx.clearRect(0,0,W,H);
 ctx.save();
 if(G.shake>0)ctx.translate((Math.random()-0.5)*18*G.shake,(Math.random()-0.5)*18*G.shake);
 if(fz){ctx.translate(W/2,GY-22);ctx.scale(ZOOM,ZOOM);ctx.translate(-W/2,-(GY-22));}
 drawWorld(camX);
 for(i=0;i<G.obst.length;i++){o=G.obst[i];sx=o.x-camX;if(sx<-320||sx>W+320)continue;
  if(o.t==='goal'){if(i>=G.idx)drawSign(sx-150,'UHNI!',o.n+'/'+NOBST);goalBack(sx,o.w);}
  else if(o.t==='bins'){if(i>=G.idx)drawSign(sx-152,'SKOČ!',o.n+'/'+NOBST);}
  else if(o.t==='juice'){if(!G.drank)drawBottleWorld(sx);}
  else if(o.t==='fight'){drawArena(sx);}
  if(CFG.chalk&&i===G.idx&&!o.pressed&&(o.t==='goal'||o.t==='bins')){ctx.save();ctx.translate(-camX,0);drawChalk(o);ctx.restore();}}
 if(fz){px=P.x-camX;bx=px+GAP;
  st={duck:false,air:false,anim:0,punch:F.pAnim>0,kick:F.pKick>0,block:F.blk>0&&F.open<=0,dodge:F.dg>0};
  ctx.save();if(F.hurt>0)ctx.translate(-3,0);if(F.dg>0)ctx.translate(-7,0);
  if(F.pAnim>0||F.pKick>0)ctx.translate(9,0);
  drawKid(px,GY,st);ctx.restore();
  bs={punch:F.bAnim>0,kick:F.bKick>0,wind:F.phase==='wind'&&F.atk==='punch',windk:F.phase==='wind'&&F.atk==='kick',hurt:F.bhurt>0};
  ctx.save();if(F.bhurt>0)ctx.translate(3,0);if(F.bAnim>0||F.bKick>0)ctx.translate(-10,0);
  drawBoss(bx,GY,bs);ctx.restore();
  if(F.phase==='wind')txt(F.atk==='kick'?'!!':'!',bx,GY-62,F.atk==='kick'?'#c9a0ff':'#ff4d6d','bold 17px monospace','center');
  for(i=0;i<F.spark.length;i++){sp=F.spark[i];b(px+sp.x,GY+sp.y,2,2,sp.c);}
  for(i=0;i<F.dmg.length;i++){d=F.dmg[i];ctx.globalAlpha=clamp(d.life,0,1);
   txt(d.t,px+d.x,GY+d.y,d.c,'bold 11px monospace','center');ctx.globalAlpha=1;}
 }else{
  drawKid(P.x-camX,GY-P.y,{duck:P.duck>0,air:P.air,anim:P.anim});
  for(i=0;i<G.fx.length;i++){d=G.fx[i];ctx.globalAlpha=clamp(d.life,0,1);
   txt(d.t,d.x-camX,GY+d.y,d.c,'bold 9px monospace','center');ctx.globalAlpha=1;}}
 for(i=0;i<G.obst.length;i++){o=G.obst[i];sx=o.x-camX;if(sx<-320||sx>W+320)continue;
  if(o.t==='goal')goalFront(sx,o.w);else if(o.t==='bins')drawBins(sx,o.w,o.h);}
 ctx.restore();
 if(fz)drawFightHud();
 drawHud();
 if(G.flash>0){ctx.fillStyle='rgba(255,180,60,'+(G.flash*0.9)+')';ctx.fillRect(0,0,W,H);}}
function addBtn(l,c,f){var el=document.createElement('button');el.type='button';el.textContent=l;el.className=c||'';
 el.addEventListener('pointerdown',function(ev){ev.preventDefault();aKick();f(el);});D.ovBtns.appendChild(el);return el;}
function setCtrl(k){var sets,list,i,bt,el;
 if(k===ctrlKey)return;ctrlKey=k;
 sets={none:[],duck:[{l:'UHNOUT',f:aDuck,c:'danger'}],jump:[{l:'PŘESKOČIT',f:aJump,c:'cool'}],
  fight:[{l:'úder',f:function(){hit('jab');},c:'ok'},{l:'kop',f:function(){hit('kick');},c:'danger'},
         {l:'blok',f:blk,c:'cool'},{l:'uhnout',f:dodge,c:'warn'}]};
 list=sets[k]||[];D.ctrl.innerHTML='';D.ctrl.className=(k==='fight')?'multi':'';
 for(i=0;i<list.length;i++){bt=list[i];el=document.createElement('button');el.type='button';el.textContent=bt.l;
  el.className=(bt.c||'')+(bt.s?' span2':'');
  el.addEventListener('pointerdown',(function(fn){return function(ev){ev.preventDefault();aKick();fn();};})(bt.f));
  D.ctrl.appendChild(el);}}
function showOv(t,bd,btns,two){var i;D.ovT.innerHTML=t;D.ovB.innerHTML=bd;D.ovArt.innerHTML='';
 if(D.ovX)D.ovX.innerHTML='';D.ovBtns.innerHTML='';D.ovBtns.className=two?'two':'';
 btns=btns||[];for(i=0;i<btns.length;i++)addBtn(btns[i].l,btns[i].c,btns[i].f);
 D.ov.className='on';}

function showJuice(){setCtrl('none');
 showOv('OPRCHAL JUICE','Na cestě leží plná láhev oranžového moku. Bez XP finálního bosse <b>neporazíš</b>... ale čas ti běží dál!',
 [{l:'vypít (+100 XP)',f:function(){drink(true);},c:'ok'},{l:'nevypít',f:function(){drink(false);},c:'ghost'}]);
 D.ovArt.innerHTML=BOTTLE;}
function drink(y){hideOv();G.drank=y;if(y){G.xp=100;G.flash=0.6;S.gulp();setTimeout(function(){S.power();},380);vib(90);}else{S.back();}
 G.idx++;G.P.x+=52;G.state='run';ctrlKey='x';setCtrl('none');}
function whyText(o){var w;
 if(!o)return '';
 if(!o.pressed){w=winOf(o);
  if(w&&G.P.x>w.hi)return 'Nestiskl jsi <b>včas</b> – správný okamžik už byl za tebou.';
  return 'Tlačítko jsi nestiskl vůbec.';}
 if(o.bad==='early')return 'Zmáčkl jsi <b>příliš brzo</b> – akce ti skončila dřív, než jsi dojel k překážce.';
 if(o.bad==='late')return 'Zmáčkl jsi <b>příliš pozdě</b> – už to nestačil vybrat.';
 return '';}
function die(r,o){var t,ex,nn;
 G.state='dead';G.shake=0.45;ctrlKey='x';setCtrl('none');vib([70,50,130]);
 if(r==='tooth'){S.tooth();}else if(r==='leg'){S.leg();}
 setTimeout(function(){S.lose();},r==='ko'?60:420);
 ex=whyText(o);nn=o&&o.n?' (překážka '+o.n+'/'+NOBST+')':'';
 t={tooth:['AU! ZUB V TRÁVĚ','Nabral jsi tyčku od branky přímo hubou'+nn+'. Jeden zub zůstal v trávě.'],
    leg:['ZLOMENÁ NOHA','Popelnice 1 : 0 ty'+nn+'. Noha praskla jako suchá větev.'],
    ko:['K.O. – VOJTĚCH POSPÍŠIL VYHRÁL',(G.xp<100?'Bez <b>Oprchal juice</b> jsi na Vojtu neměl nárok – rány ho jen lechtaly.':'Došly ti životy. Blokuj rány a před kopem uhni!')]}[r]||['KONEC HRY',''];
 showOv(t[0],t[1]+(ex?'<br>'+ex:'')+'<br><br>Čas: <b>'+fmt(G.time)+'</b> &middot; perfekt: <b>'+G.perf+'/'+NOBST+'</b>',
  [{l:'zkusit znovu',f:start,c:'danger'},{l:'tabulka časů',f:function(){showBoard(null,0);},c:'ghost small'}]);}
function winGame(){var nm=LS(NKEY)||'TOM';
 G.state='win';ctrlKey='x';setCtrl('none');vib([30,40,30,40,160]);S.win();
 showOv('VYHRÁL JSI!','Vojtěch Pospíšil leží v prachu na Staré osadě.<br><br>Čas: <b>'+fmt(G.time)+'</b><br>Perfekt: <b>'+G.perf+'/'+NOBST+'</b> &middot; nejdelší série: <b>'+G.best+'x</b> &middot; Životy: <b>'+Math.round(G.lives)+'</b>',
  [{l:'uložit do tabulky',f:submitScore,c:'ok'},{l:'hrát znovu',f:start,c:'ghost'}],true);
 if(D.ovX)D.ovX.innerHTML='<input class="nm" id="nm" maxlength="12" placeholder="tvé jméno" value="'+esc(nm)+'">';}
function submitScore(el){var inp=document.getElementById('nm'),n=(inp&&inp.value)?inp.value:'TOM',ms=Math.round(G.time*1000),pf=G.perf,lv=Math.round(G.lives);
 n=n.replace(/[^0-9A-Za-zÀ-ž _.-]/g,'').trim().toUpperCase().slice(0,12)||'TOM';
 LS(NKEY,n);S.ui();
 if(el){el.disabled=true;el.textContent='odesílám...';}
 lbSubmit(n,ms,pf,lv,function(err){
  showOv(err?'ČAS ULOŽEN MÍSTNĚ':'ČAS V TABULCE',
   err?'Globální tabulka je teď nedostupná ('+esc(String(err))+'), čas je uložený v telefonu.':'Tvůj čas <b>'+fmt(ms/1000)+'</b> je zapsán navždy.',

function showBoard(hn,hm){S.ui();
 showOv('TABULKA ČASŮ',LB.busy?'načítám...':'Nejlepší průběhy parkourem. <b>P</b> = perfektní trefení z '+NOBST+'.',
  [{l:'obnovit',f:function(){lbLoad(function(){showBoard(hn,hm);});},c:'ghost small'},{l:'zpět do menu',f:menu,c:'ghost small'}],true);
 if(D.ovX)D.ovX.innerHTML=lbTable(hn,hm,10);
 if(!LB.loaded&&!LB.busy)lbLoad(function(){if(D.ovX)D.ovX.innerHTML=lbTable(hn,hm,10);});}
function start(){newGame();G.state='run';hideOv();ctrlKey='x';setCtrl('none');S.ui();}
function menu(){newGame();
 showOv("PARKOUR CHALLENGE<br><span style='font-size:13px;color:#9fb6e0'>aneb na skok do dětství</span>",
 "Běžíš sám – tlačítko, které se objeví dole, zmáčkni těsně před překážkou: "+NOBST+" překážek a pak Vojta.",
 [{l:'start',f:start,c:'ok'},{l:'tabulka časů',f:function(){showBoard(null,0);},c:'ghost small'}]);}
function loop(ts){var dt=Math.min(0.05,(ts-last)/1000)||0;last=ts;
 if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;
 if(G.state==='run'){G.time+=dt;updateRun(dt);
  if(G.state==='run')setCtrl(G.act==='duck'?'duck':(G.act==='jump'?'jump':'none'));}
 else if(G.state==='juice'){G.time+=dt;}
 else if(G.state==='fight'){G.time+=dt;updateFight(dt);}
 else if(G.state==='menu'){G.P.anim+=dt*11;G.P.x+=SPEED*dt*0.3;G.tram+=dt;}
 draw();requestAnimationFrame(loop);}
function onKey(e){var k=(e.key||'').toLowerCase(),bt;aKick();
 if(G.state==='run'){if(k==='arrowdown'||k==='s')aDuck();if(k==='arrowup'||k===' '||k==='w')aJump();}
 else if(G.state==='fight'){if(k==='a')hit('jab');if(k==='s')hit('kick');if(k==='d')blk();if(k==='f'||k==='arrowup')dodge();}
 else if(k==='enter'){bt=D.ovBtns.querySelector('button');if(bt)bt.dispatchEvent(new Event('pointerdown',{cancelable:true}));}}
function boot(){var ids=['ov','ovBox','ovT','ovB','ovArt','ovBtns','ctrl','mute'],i;
 cvs=document.getElementById('c');ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
 for(i=0;i<ids.length;i++)D[ids[i]]=document.getElementById(ids[i]);
 D.ovX=document.createElement('div');D.ovX.id='ovX';
 if(D.ovBox&&D.ovBox.insertBefore)D.ovBox.insertBefore(D.ovX,D.ovBtns);
 MUTED=LS(MKEY)==='1';setMute(MUTED);
 if(D.mute)D.mute.addEventListener('pointerdown',function(e){e.preventDefault();aKick();setMute(!MUTED);if(!MUTED)S.ui();});
 document.addEventListener('keydown',onKey);
 document.addEventListener('pointerdown',aKick);
 document.addEventListener('contextmenu',function(e){e.preventDefault();});
 loadFaces();lbLoad();menu();requestAnimationFrame(loop);}
if(typeof document!=='undefined')boot();
window.PK={get G(){return G;},get LB(){return LB;},CFG:CFG,start:start,menu:menu,aDuck:aDuck,aJump:aJump,
 hit:hit,blk:blk,dodge:dodge,drink:drink,updateRun:updateRun,updateFight:updateFight,newGame:newGame,

 showBoard:showBoard,faceCanvas:faceCanvas,fmt:fmt};
